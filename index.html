<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Palia Map - XENEON EDGE</title>

    <style>
        /* =========================================
           FULL SCREEN
           ========================================= */

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #000;
        }


        /* =========================================
           MAP VIEWPORT

           Anything outside this area is clipped.
           ========================================= */

        .map-viewport {
            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #000;
        }


        /* =========================================
           MAP IFRAME

           1.3x visual zoom
           ========================================= */

        .map-viewport iframe {
            position: absolute;

            /*
             * Move the enlarged map back toward
             * the center of the screen.
             */
            left: -15%;
            top: -15%;

            /*
             * 130% = approximately 1.3x zoom
             */
            width: 130%;
            height: 130%;

            border: none;

            display: block;
        }
    </style>
</head>

<body>

    <div class="map-viewport">

        <iframe
            src="https://palia.th.gl/maps/Royal%20Highlands"
            allow="geolocation; microphone; camera; fullscreen">
        </iframe>

    </div>

</body>
</html>
