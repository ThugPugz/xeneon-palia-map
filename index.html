<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palia Map - XENEON EDGE</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }

        .map-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .map-viewport iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;

            /* Zoom control: 1.3 = 130% zoom. Increase to zoom in further (e.g., 1.5) */
            transform: scale(1.05);
            /* Keeps the zoom focused in the center of your screen */
            transform-origin: center center; 
        }
    </style>
</head>
<body>

    <div class="map-viewport">
        <iframe 
            src="https://palia.th.gl/maps/Royal%20Highlands" 
            allow="geolocation; microphone; camera">
        </iframe>
    </div>

</body>
</html>
