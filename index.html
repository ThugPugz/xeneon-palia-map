<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palia Map - XENEON EDGE</title>
    <style>
        /* Fill the screen without scrollbars or margins */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }

        /* 1:1 Viewport Container */
        .map-viewport {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Pure full-width frame - Stylus controls internal map zoom */
        .map-viewport iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="map-viewport">
        <iframe 
            src="https://palia.th.gl/maps/Royal%20Highlands" 
            allow="geolocation; microphone; camera">
        </iframe>
    </div>

</body>
</html>
