<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palia Map - XENEON EDGE</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }

        .map-viewport {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Clips anything extending past screen height */
            position: relative;
        }

        .map-viewport iframe {
            width: 100%;
            /* Extends iframe past the bottom to push ads off-screen */
            height: calc(100% + 90px); 
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <div class="map-viewport">
        <iframe 
            src="https://palia.th.gl/maps/Royal%20Highlands" 
            allow="geolocation; microphone; camera">
        </iframe>
    </div>

</body>
</html>
