<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palia Map - XENEON EDGE</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }

        .map-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Clips the bottom ad that hangs outside this box */
        }

        .map-viewport iframe {
            width: 100%;
            /* Make the iframe slightly taller so the bottom ad is pushed past 100% height */
            height: calc(100% + 80px); 
            border: none;
            position: absolute;
            top: 0;
            left: 0;

            /* Your desired 1.05 zoom level */
            transform: scale(1.05);
            /* Scale from the top so it doesn't pull the bottom ad back up into view */
            transform-origin: top center; 
        }
    </style>
</head>
<body>

    <div class="map-viewport">
        <iframe 
            src="https://palia.th.gl/maps/Royal%20Highlands" 
            allow="geolocation; microphone; camera">
        </iframe>
    </div>

</body>
</html>
