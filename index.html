<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Palia Map - XENEON EDGE</title>

    <style>
        /* =========================================
           FULLSCREEN PAGE
           ========================================= */

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #000;
        }


        /* =========================================
           MAP WRAPPER

           Anything outside this area is completely
           clipped and cannot be displayed.
           ========================================= */

        .map-wrapper {
            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #000;
        }


        /* =========================================
           PALIA MAP

           The iframe is made slightly taller than
           the screen so the bottom portion can be
           pushed outside the visible wrapper.

           Change 150px if the ad area is larger/
           smaller.
           ========================================= */

        .map-wrapper iframe {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: calc(100% + 150px);

            border: none;

            display: block;
        }
    </style>
</head>

<body>

    <div class="map-wrapper">

        <iframe
            src="https://palia.th.gl/maps/Royal%20Highlands"
            allow="geolocation; microphone; camera; fullscreen"
            loading="eager">
        </iframe>

    </div>

</body>
</html>
